name: Android E2E

on:
  push:
    branches-ignore: [e2e-results]
    paths: ['mobile/**', 'relay/**', '.github/workflows/android-e2e.yml']
  workflow_dispatch:

concurrency:
  group: android-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            relay/package-lock.json
      - run: npm ci
      - run: npm ci
        working-directory: relay
      - run: npm run typecheck
      - run: npm run typecheck
        working-directory: relay
      - run: npm run lint
      - run: npm test
      - name: Sync integration test (two phones through a local relay)
        run: npm run test:sync

  android:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      E2E_OUT: ${{ github.workspace }}/e2e-out
    steps:
      - name: Free disk space (APK build + emulator image need ~20 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost \
            /usr/local/lib/node_modules /usr/share/swift "$AGENT_TOOLSDIRECTORY/CodeQL" \
            /usr/local/share/powershell /usr/local/share/chromium /opt/microsoft || true
          sudo docker image prune --all --force > /dev/null 2>&1 || true
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            mobile/package-lock.json
            relay/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install dependencies
        run: |
          (cd mobile && npm ci)
          (cd relay && npm ci)

      - name: Build release APK (x86_64 for the emulator, arm64 for phones)
        working-directory: mobile
        env:
          # The production relay, once deployed (repository variable RELAY_URL).
          EXPO_PUBLIC_RELAY_URL: ${{ vars.RELAY_URL }}
          # Firebase app config for push (optional secret GOOGLE_SERVICES_JSON).
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          fi
          npx expo prebuild --platform android --no-install
          cd android
          ./gradlew assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a
          cp app/build/outputs/apk/release/app-release.apk ../babytracker.apk
          # Free the build daemons' memory for the emulator.
          ./gradlew --stop

      - name: Remove build intermediates before the emulator
        run: |
          cp mobile/android/app/build/outputs/apk/release/app-release.apk mobile/babytracker.apk
          rm -rf mobile/android/app/build mobile/android/build mobile/android/.cxx mobile/android/app/.cxx
          find mobile/node_modules -path '*/android/build' -type d -prune -exec rm -rf {} + || true
          find mobile/node_modules -path '*/android/.cxx' -type d -prune -exec rm -rf {} + || true
          sudo rm -rf /usr/local/lib/android/sdk/ndk || true
          df -h /

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run E2E on emulator
        timeout-minutes: 45
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash mobile/e2e/run-e2e.sh mobile/babytracker.apk "$E2E_OUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: e2e-out
          if-no-files-found: ignore

      - name: Publish results to the e2e-results branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p e2e-out
          cd e2e-out
          [ -f summary.md ] || echo "# Android E2E results: no summary (run failed before the tests)" > summary.md
          {
            echo ""
            echo "Commit: ${GITHUB_SHA}"
            echo "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } >> summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          # Keep the branch small: no full logcat or videos.
          find . -name "*.mp4" -delete
          [ -f logcat.txt ] && tail -n 5000 logcat.txt > logcat.tmp && mv logcat.tmp logcat.txt
          git init -q -b e2e-results
          git add -A
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "E2E results for ${GITHUB_SHA::7}"
          git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" e2e-results

      - name: Publish APK as the android-latest pre-release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest mobile/babytracker.apk \
            --prerelease --target "$GITHUB_SHA" \
            --title "Android test build ${GITHUB_SHA::7}" \
            --notes "Debug-signed test build from ${GITHUB_SHA::7}. All E2E checks passed. Install on the phone: download babytracker.apk and open it."
