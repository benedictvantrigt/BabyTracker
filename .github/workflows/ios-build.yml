name: iOS build

# Builds the acceptance app for the iOS Simulator (no Apple account or signing needed) to
# check that the iOS project compiles. Started by hand only: macOS runners use the
# repository's Actions minutes at a much higher rate than Linux.
on:
  workflow_dispatch:

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: xcodebuild -version

      - name: Generate the iOS project
        env:
          APP_VARIANT: acceptance
          EXPO_PUBLIC_RELAY_URL: ${{ vars.RELAY_URL_ACC }}
        run: npx expo prebuild --platform ios

      - name: Build for the Simulator
        env:
          APP_VARIANT: acceptance
          EXPO_PUBLIC_RELAY_URL: ${{ vars.RELAY_URL_ACC }}
        run: |
          set -o pipefail
          workspace=$(ls -d ios/*.xcworkspace | head -n 1)
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO | tail -n 200
          app=$(ls -d build/Build/Products/Release-iphonesimulator/*.app | head -n 1)
          ditto -c -k --keepParent "$app" babytracker-simulator.zip

      - uses: actions/upload-artifact@v4
        with:
          name: babytracker-ios-simulator
          path: mobile/babytracker-simulator.zip
          if-no-files-found: error
