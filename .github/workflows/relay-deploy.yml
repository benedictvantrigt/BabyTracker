name: Deploy relay

# Deploys relay/ to Cloudflare Workers. Needs two repository secrets:
#   CLOUDFLARE_API_TOKEN  (token with the "Edit Cloudflare Workers" template)
#   CLOUDFLARE_ACCOUNT_ID
# Without them the job reports what is missing and skips the deploy.
on:
  push:
    branches-ignore: [e2e-results]
    paths: ['relay/**', '.github/workflows/relay-deploy.yml']
  workflow_dispatch:

concurrency:
  group: relay-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: relay
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: relay/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Deploy
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets not set; skipping deploy."
            exit 0
          fi
          npx wrangler deploy | tee deploy.log
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "Relay deployed at: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          curl -sf "$url/health"
