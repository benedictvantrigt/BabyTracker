name: Upload to Google Play

# Uploads the app bundle of an existing GitHub release to a Google Play track, by hand: for
# when the upload at the end of a release failed, or to put a release on another track.
# Same keyless sign-in as the release job (README, Google Play).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, for example v0.9.0
        required: true
      track:
        description: Play track
        required: true
        default: internal
        type: choice
        options: [internal, alpha, beta]

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Only this environment (main only) may sign in as the Play publisher.
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Download the app bundle from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release download "$TAG" --pattern "napchime-$TAG.aab" --output napchime.aab

      - name: Sign in to Google Play
        id: play-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/921748666983/locations/global/workloadIdentityPools/github/providers/babytracker
          service_account: play-publisher@com-napchime-app.iam.gserviceaccount.com
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false

      - name: Upload the app bundle to Google Play
        env:
          PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
          TAG: ${{ inputs.tag }}
          TRACK: ${{ inputs.track }}
          STATUS: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
        run: |
          package=$(node -p "require('./mobile/app.json').expo.android.package")
          bash .github/scripts/play-upload.sh napchime.aab "$package" "$TRACK" "$TAG" "$STATUS"
