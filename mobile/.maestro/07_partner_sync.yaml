appId: com.babytracker.app.acc
name: Join a partner's family and sync both ways
# INVITE comes from the test runner (-e INVITE=...); a default here would override it.
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- assertVisible: 'Welcome'
- tapOn: 'Join your partner'
- assertVisible: 'Join your partner'
- tapOn:
    id: 'invite-code'
- inputText: ${INVITE}
- hideKeyboard
- tapOn: 'Join'
- takeScreenshot: 07-after-join-tap
# The partner's child and feed arrive from the relay; the emulator can be slow here.
- extendedWaitUntil:
    visible: 'Micky'
    timeout: 40000
- assertVisible: 'Last: Left, .* ago'
- takeScreenshot: 07-joined
# Log a diaper here; the test machine checks the partner receives it.
- tapOn: 'Wet'
- assertVisible: 'Diaper logged: wet'
- tapOn: 'Settings'
- scrollUntilVisible:
    element:
      id: 'sync-status'
# The card lists the family's phones, so its buttons sit lower.
- scrollUntilVisible:
    element: 'Sync now'
- tapOn: 'Sync now'
- scrollUntilVisible:
    element:
      id: 'sync-status'
      text: 'Synced at .*'
    direction: UP
- assertVisible: '.*\(this phone\)'
- takeScreenshot: 07-sync-settings
