appId: com.babytracker.app.acc
name: Join a partner's family and sync both ways
# INVITE comes from the test runner (-e INVITE=...); a default here would override it.
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow:
    file: subflows/system-dialogs.yaml
- assertVisible: 'Welcome'
# iOS: the name field takes focus and its keyboard covers "Join your partner".
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: 'Welcome'
- tapOn: 'Join your partner'
# The join screen's own text (the welcome screen has a "Join your partner" button too).
- assertVisible: 'OR PASTE THE CODE'
- tapOn:
    id: 'invite-code'
- inputText: ${INVITE}
- runFlow:
    file: subflows/dismiss-keyboard.yaml
    env:
      LABEL: 'OR PASTE THE CODE'
- tapOn: 'Join'
- takeScreenshot: 07-after-join-tap
# The partner's child and feed arrive from the relay; the emulator can be slow here.
- extendedWaitUntil:
    visible: 'Micky'
    timeout: 40000
- assertVisible: 'Last: Left, .* ago'
- takeScreenshot: 07-joined
# Log a diaper here; the test machine checks the partner receives it. Centre the button
# first: on iOS the floating tab bar covers the bottom of the screen.
- scrollUntilVisible:
    element: 'Wet'
    centerElement: true
- tapOn: 'Wet'
- assertVisible: 'Diaper logged: wet'
- tapOn: 'Settings'
- scrollUntilVisible:
    element:
      id: 'sync-status'
# The card lists the family's phones, so its buttons sit lower.
- scrollUntilVisible:
    element: 'Sync now'
    centerElement: true
- tapOn: 'Sync now'
- scrollUntilVisible:
    element:
      id: 'sync-status'
      text: 'Synced at .*'
    direction: UP
- assertVisible: '.*\(this phone\)'
- takeScreenshot: 07-sync-settings
