appId: com.napchime.app.acc
name: Timeline lists entries; edit and delete
---
- runFlow: subflows/onboard.yaml
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Wet'
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Left'
- runFlow: subflows/today-top.yaml
- assertVisible: '(Edit )?Feeding · Left( at .*)?'
- runFlow: subflows/tap-stop.yaml
- tapOn: 'Timeline'
- assertVisible: 'TODAY'
- assertVisible: '(Edit )?Feeding · Left( at .*)?'
- assertVisible: '(Edit )?Diaper · Wet( at .*)?'
- takeScreenshot: 04-timeline
# Entry rows: Android exposes the row's texts, iOS its label ("Edit Diaper · Wet at 10:15").
# Edit the diaper: also solid, and tag it (typed, saved without pressing enter).
- tapOn: '(Edit )?Diaper · Wet( at .*)?'
- assertVisible: 'Edit diaper'
- tapOn:
    id: 'toggle-solid'
- scrollUntilVisible:
    element:
      id: 'tag-input'
- tapOn:
    id: 'tag-input'
- inputText: 'teething'
- runFlow:
    file: subflows/dismiss-keyboard.yaml
    env:
      LABEL: 'Tags'
- tapOn: 'Save'
- assertVisible: '(Edit )?Diaper · Wet \+ solid( at .*)?'
- assertVisible: '.*#teething.*'
# Filter the timeline by the tag: the feed (untagged) disappears.
- tapOn:
    id: 'filter-tag-teething'
- assertNotVisible: '(Edit )?Feeding · Left( at .*)?'
- tapOn:
    id: 'filter-tag-teething'
- assertVisible: '(Edit )?Feeding · Left( at .*)?'
# Delete the feed (Android alert: second button is the positive one).
- tapOn: '(Edit )?Feeding · Left( at .*)?'
- assertVisible: 'Edit feeding'
- tapOn: 'Delete'
- assertVisible: 'Delete entry\?'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: 'android:id/button1'
- runFlow:
    when:
      platform: iOS
    commands:
      # The alert's button, not the screen's own Delete button under the alert.
      - tapOn:
          text: 'Delete'
          rightOf: 'Cancel'
- assertNotVisible: '(Edit )?Feeding · Left( at .*)?'
- assertVisible: '(Edit )?Diaper · Wet \+ solid( at .*)?'
- takeScreenshot: 04-timeline-after-edit
