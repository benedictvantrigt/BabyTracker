appId: com.babytracker.app.acc
name: Onboarding shows the default dashboard and the sleep plan
---
- runFlow: subflows/onboard.yaml
- assertVisible: '0 days'
- assertVisible:
    id: 'card-sleep'
- assertVisible:
    id: 'card-feeding'
- assertVisible:
    id: 'card-diaper'
- assertVisible: 'No sleep logged yet'
- assertVisible: 'No feeding logged yet'
# A newborn follows the age schedule: next nap or bedtime, and today's plan.
- assertVisible:
    id: 'schedule-next'
- scrollUntilVisible:
    element:
      id: 'schedule-plan'
- tapOn:
    id: 'schedule-plan'
- assertVisible: 'Nap 1 .*'
- assertVisible: 'Night .* of .*'
- assertVisible: 'Day sleep .* of .*'
# The day's total is the last line of the card (#55).
- scrollUntilVisible:
    element:
      id: 'sleep-total'
- assertVisible: 'Sleep today 0m of .*'
- takeScreenshot: 01-sleep-plan
- scrollUntilVisible:
    element:
      id: 'card-today'
- takeScreenshot: 01-dashboard
