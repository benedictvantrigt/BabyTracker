appId: com.napchime.app.acc
name: Sleep timer, and leaves reminders scheduled for the alarm check
---
- runFlow: subflows/onboard.yaml
# Daytime feed reminders on, so a feed reminder is scheduled whatever the CI clock says.
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'ON DUTY'
# My days: a day turns off and on again (all days on, so the reminders below still fire).
- scrollUntilVisible:
    element:
      id: 'duty-day-1'
- assertVisible: 'My days'
- tapOn:
    id: 'duty-day-1'
- tapOn:
    id: 'duty-day-1'
# Track night sleep: off and on again (on, so Start sleep shows whatever the CI clock says).
- scrollUntilVisible:
    element:
      id: 'toggle-night-sleep'
    centerElement: true
- tapOn:
    id: 'toggle-night-sleep'
- assertVisible: 'Only naps are timed.*'
- tapOn:
    id: 'toggle-night-sleep'
- assertVisible: 'Sleep is timed day and night.*'
# Lock-screen timers switch per phone under Sleep.
- scrollUntilVisible:
    element:
      id: 'toggle-awake-timer'
- assertVisible:
    id: 'toggle-sleep-timer'
- scrollUntilVisible:
    element:
      id: 'toggle-feed-day'
- tapOn:
    id: 'toggle-feed-day'
- tapOn: 'Today'
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Start sleep'
- runFlow: subflows/today-top.yaml
- assertVisible: 'Asleep since .*'
- assertVisible: '(Edit )?(Micky is asleep|Nap|Night sleep)'
- takeScreenshot: 06-sleeping
- runFlow: subflows/tap-stop.yaml
- assertVisible: 'Awake .* \(since .*\)'
# Leave a feed running: its ongoing notification is checked after the flows.
- extendedWaitUntil:
    notVisible: 'UNDO'
    timeout: 10000
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Left'
- runFlow: subflows/today-top.yaml
- assertVisible: '(Edit )?Feeding · Left( at .*)?'
- takeScreenshot: 06-feed-running
