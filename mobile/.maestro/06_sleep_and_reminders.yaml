appId: com.babytracker.app.acc
name: Sleep timer, and leaves reminders scheduled for the alarm check
---
- runFlow: subflows/onboard.yaml
# Daytime feed reminders on, so a feed reminder is scheduled whatever the CI clock says.
- tapOn: 'Settings'
- scrollUntilVisible:
    element: 'THIS PHONE'
- scrollUntilVisible:
    element:
      id: 'toggle-feed-day'
- tapOn:
    id: 'toggle-feed-day'
- tapOn: 'Today'
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Start sleep'
- runFlow: subflows/today-top.yaml
- assertVisible: 'Asleep since .*'
- assertVisible: '(Edit )?(Micky is asleep|Nap|Night sleep)'
- takeScreenshot: 06-sleeping
- runFlow: subflows/tap-stop.yaml
- assertVisible: 'Awake .* \(since .*\)'
# Leave a feed running: its ongoing notification is checked after the flows.
- extendedWaitUntil:
    notVisible: 'UNDO'
    timeout: 10000
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Left'
- runFlow: subflows/today-top.yaml
- assertVisible: '(Edit )?Feeding · Left( at .*)?'
- takeScreenshot: 06-feed-running
