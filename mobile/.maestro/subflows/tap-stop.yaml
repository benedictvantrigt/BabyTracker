# Taps Stop on the running timer card at the top of the Today screen, scrolling up to it
# when the screen was scrolled down to a button further below. No centring: Stop sits on the
# top card, where the screen cannot scroll it to the middle and Maestro would swipe until timeout.
appId: com.napchime.app.acc
---
- scrollUntilVisible:
    element: 'Stop'
    direction: UP
- tapOn: 'Stop'
