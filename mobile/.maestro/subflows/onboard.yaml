# Fresh install, all permissions granted, baby "Micky" created.
appId: com.babytracker.app.acc
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- assertVisible: 'Welcome'
- tapOn:
    id: 'child-name'
- inputText: 'Micky'
- runFlow:
    file: dismiss-keyboard.yaml
    env:
      LABEL: 'Welcome'
- tapOn: 'Start tracking'
# iOS asks for notifications in a system alert (Android has the permission granted above).
- runFlow:
    when:
      platform: iOS
      visible: 'Allow'
    commands:
      - tapOn: 'Allow'
- assertVisible: 'Micky'
