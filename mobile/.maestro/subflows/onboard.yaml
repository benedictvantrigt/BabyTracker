# Fresh install, all permissions granted, baby "Micky" created.
appId: com.babytracker.app.acc
---
- launchApp:
    clearState: true
    permissions:
      all: allow
- runFlow:
    file: system-dialogs.yaml
- assertVisible: 'Welcome'
- tapOn:
    id: 'child-name'
- inputText: 'Micky'
- runFlow:
    file: dismiss-keyboard.yaml
    env:
      LABEL: 'Welcome'
- tapOn: 'Start tracking'
# iOS may ask for notifications in a system alert (usually not: permissions are granted at
# launch). Optional, as a "visible" check can see the alert just before it goes.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: 'Allow'
          optional: true
- assertVisible: 'Micky'
