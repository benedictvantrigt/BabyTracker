# Closes a modal screen: Android's back button; on iOS, swipe the sheet down.
appId: com.napchime.app.acc
---
- runFlow:
    when:
      platform: Android
    commands:
      - back
- runFlow:
    when:
      platform: iOS
    commands:
      - swipe:
          start: 50%, 15%
          end: 50%, 95%
          duration: 400
      - waitForAnimationToEnd
