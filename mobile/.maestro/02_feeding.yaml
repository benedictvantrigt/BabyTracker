appId: com.babytracker.app.acc
name: Breast feeding timers switch sides, bottle feed with amount
---
- runFlow: subflows/onboard.yaml
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Left'
- runFlow: subflows/today-top.yaml
- assertVisible: '(Edit )?Feeding · Left( at .*)?'
- takeScreenshot: 02-feeding-left-running
# The undo bar can cover the buttons, depending on how tall the cards above are.
- extendedWaitUntil:
    notVisible: 'UNDO'
    timeout: 10000
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Right'
- runFlow: subflows/today-top.yaml
- assertVisible: '(Edit )?Feeding · Right( at .*)?'
- assertNotVisible: '(Edit )?Feeding · Left( at .*)?'
- runFlow: subflows/tap-stop.yaml
- assertNotVisible: '(Edit )?Feeding · Right( at .*)?'
- assertVisible: 'Last: Right, .* ago'
- assertVisible: 'Next due at .*'
- extendedWaitUntil:
    notVisible: 'UNDO'
    timeout: 10000
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Bottle'
- assertVisible: 'Add feeding'
- tapOn:
    id: 'feed-amount'
- inputText: '120'
- runFlow:
    file: subflows/dismiss-keyboard.yaml
    env:
      LABEL: 'Amount \(ml\)'
- tapOn: 'Save'
# A form entry starts 15 minutes back by default, so "Last" still shows the breast feed.
- assertVisible: 'Last: Right, .* ago'
- takeScreenshot: 02-feeding-after-bottle
- tapOn: 'Timeline'
- assertVisible: '(Edit )?Feeding · Bottle 120 ml · Formula( at .*)?'
- assertVisible: '(Edit )?Feeding · Right( at .*)?'
- assertVisible: '(Edit )?Feeding · Left( at .*)?'
- takeScreenshot: 02-feeding-timeline
