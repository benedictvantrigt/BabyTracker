appId: com.napchime.app.acc
name: One-tap diapers with undo
---
- runFlow: subflows/onboard.yaml
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Wet'
- assertVisible: 'Diaper logged: wet'
- takeScreenshot: 03-diaper-undo-banner
- tapOn: 'UNDO'
- assertVisible: 'No diaper change logged yet'
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Both'
- assertVisible: 'Last change .* ago'
# The undo bar can cover the buttons, depending on how tall the cards above are.
- extendedWaitUntil:
    notVisible: 'UNDO'
    timeout: 10000
- runFlow:
    file: subflows/tap-today.yaml
    env:
      LABEL: 'Solid'
- scrollUntilVisible:
    element: '1 wet · 2 solid'
- takeScreenshot: 03-diaper-totals
